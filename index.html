<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearWait – Smart Scheduling and Usage Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f8fb;--card:#fff;--ink:#0d2b40;--mut:#5c7487;--line:#e0ebf1;--blue:#1d6fd8;--teal:#0fb5a8;--g:#16a34a;--y:#eab308;--r:#dc2626;--sh:0 6px 24px rgba(20,80,120,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1722;--card:#10222f;--ink:#e6f2f8;--mut:#8fa9ba;--line:#1d3446;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0a1722;--card:#10222f;--ink:#e6f2f8;--mut:#8fa9ba;--line:#1d3446;--sh:0 6px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(100deg,#0b4fa8,#0fb5a8);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;white-space:nowrap}nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:#fff;text-decoration:none;padding:7px 13px;border-radius:99px;font-weight:600;font-size:13.5px;white-space:nowrap;opacity:.85;transition:.2s}
nav a:hover,nav a.on{background:rgba(255,255,255,.22);opacity:1}
.who{font-size:13px;display:flex;gap:10px;align-items:center}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:26px;margin:0 0 4px;font-weight:800}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line);transition:.2s;min-width:0}
.stat:hover{transform:translateY(-3px)}.stat b{font-size:28px;display:block;font-weight:800}.stat span{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;color:#fff;font-weight:700;font-size:12px}
button,.btn{background:linear-gradient(100deg,var(--blue),var(--teal));color:#fff;border:0;padding:9px 16px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.2s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.sec{background:var(--line);color:var(--ink)}button.del{background:var(--r)}button.sm{padding:5px 10px;font-size:12px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);min-width:0}
label{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px}
.cv{position:relative;height:280px}.strip{display:flex;gap:3px}.strip div{flex:1;min-width:16px;height:46px;border-radius:7px;font-size:10px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.heat{display:grid;grid-template-columns:36px repeat(17,minmax(22px,1fr));gap:2px;font-size:10px;min-width:480px}.heat div{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff}
.rec{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.meter{height:8px;border-radius:9px;background:var(--line);margin:8px 0;overflow:hidden}.meter i{display:block;height:100%}
.chip{display:inline-block;background:var(--line);border-radius:8px;padding:2px 8px;margin:2px;font-size:12px}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b4fa8,#0fb5a8)}#auth .card{width:min(400px,100%)}#auth form{display:grid;gap:12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0d2b40;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.loader{display:inline-block;padding:24px;color:var(--mut);text-align:center;width:100%}
@media(max-width:600px){.g2{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
/* ==========================================================================
   CONFIG: Replace API_BASE with your deployed backend URL in production
   (e.g., 'https://clearwait-backend.onrender.com/api')
   ========================================================================== */
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:8000/api'
  : 'https://clearwait-backend.onrender.com/api'; // <--- Update this to your deployed backend URL

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,fh=h=>pad(h)+':00';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],H0=6,HRS=Array.from({length:17},(_,i)=>i+6);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)}
const charts={};function ch(id,cfg){charts[id]?.destroy();cfg.options=Object.assign({maintainAspectRatio:false,responsive:true},cfg.options||{});charts[id]=new Chart($('#'+id),cfg)}

/* ---------- Token & User State ---------- */
let currentUser = null;
const authStore = {
  getToken: () => localStorage.getItem('cw_jwt'),
  setToken: (t) => localStorage.setItem('cw_jwt', t),
  removeToken: () => localStorage.removeItem('cw_jwt'),
  getUser: () => {
    try { return JSON.parse(localStorage.getItem('cw_user')); } catch(e){ return null; }
  },
  setUser: (u) => localStorage.setItem('cw_user', JSON.stringify(u)),
  removeUser: () => localStorage.removeItem('cw_user')
};

/* ---------- API Client ---------- */
async function api(path, opts = {}) {
  const token = authStore.getToken();
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers['Authorization'] = `Bearer ${token}`;
  if (!(opts.body instanceof FormData) && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  try {
    const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
    if (res.status === 401) {
      authStore.removeToken();
      authStore.removeUser();
      currentUser = null;
      route();
      throw new Error('Session expired, please sign in.');
    }
    const contentType = res.headers.get('content-type') || '';
    let data;
    if (contentType.includes('application/json')) {
      data = await res.json();
    } else {
      data = await res.text();
    }
    if (!res.ok) {
      const errDetail = data?.detail || (typeof data === 'string' ? data : 'Request failed');
      throw new Error(errDetail);
    }
    return data;
  } catch (err) {
    toast(err.message || 'Network error');
    throw err;
  }
}

const me = () => currentUser || authStore.getUser();

/* ---------- booking & machine helpers ---------- */
let cacheMachines = [];
async function fetchMachines() {
  try {
    cacheMachines = await api('/machines');
    return cacheMachines;
  } catch (e) {
    return cacheMachines || [];
  }
}
const mname = (id) => (cacheMachines.find(m => m.id === id)?.name) || id;

function bTable(L, adm) {
  return L.length ? `<div class=wrap><table><tr><th>Date<th>Time<th>Machine${adm?'<th>Resident':''}<th>Status<th></tr>${L.map(b=>`<tr><td>${b.date}<td>${fh(b.hour)}<td>${b.machine_name || mname(b.machine_id)}${adm?`<td>${b.user_name || b.user_email}`:''}<td><span class=pill style="background:${b.status==='confirmed'?'var(--g)':'var(--mut)'}">${b.status}</span><td>${b.status==='confirmed'?`<button class="sm del" onclick="cancelB(${b.id})">Cancel</button>`:''}`).join('')}</table></div>` : '<p class=sub>No bookings yet.</p>';
}

async function cancelB(id) {
  try {
    await api(`/bookings/${id}/cancel`, { method: 'PATCH' });
    toast('Booking cancelled');
    const p = (location.hash.slice(1) || 'dashboard');
    if (PG[p]) PG[p]();
  } catch (e) {}
}

async function bookSlot(d, h, m) {
  try {
    const res = await api('/bookings', {
      method: 'POST',
      body: JSON.stringify({ date: d, hour: h, machine_id: m })
    });
    toast(`Booked ${res.machine_name || res.machine_id} · ${res.date} ${fh(res.hour)}`);
    location.hash = 'bookings';
    route();
  } catch (e) {}
}

/* ---------- shell & auth ---------- */
const NAV = [['dashboard','Dashboard'],['analytics','Analytics'],['kmeans','K-Means'],['best','Find Best Time'],['bookings','My Bookings'],['admin','Admin']];

function authView(reg) {
  $('#app').innerHTML = `<div id=auth><div class=card><h1>⚡ ClearWait</h1><p class=sub>${reg?'Create your resident account':'Sign in to schedule smarter washes'}</p>
<form onsubmit="return doAuth(event,${!!reg})">${reg?'<input id=an placeholder="Full name" required>':''}<input id=ae type=email placeholder="Email" required><input id=ap type=password placeholder="Password (min 6)" minlength=6 required><button id=abtn>${reg?'Register':'Log in'}</button></form>
<p class=sub style="margin:14px 0 0">${reg?'Have an account?':'New here?'} <a href=# onclick="authView(${!reg});return false">${reg?'Log in':'Register'}</a></p>
${reg?'':'<p class=sub style="font-size:12px">Demo – resident: demo@smartlaundry.com / demo123 · admin: admin@smartlaundry.com / admin123</p>'}</div></div>`;
}

async function doAuth(e, reg) {
  e.preventDefault();
  const btn = $('#abtn');
  btn.disabled = true;
  btn.textContent = 'Please wait...';
  const em = $('#ae').value.trim().toLowerCase();
  const pw = $('#ap').value;
  try {
    let authRes;
    if (reg) {
      const name = $('#an').value.trim();
      authRes = await api('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ name, email: em, password: pw })
      });
    } else {
      authRes = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: em, password: pw })
      });
    }
    authStore.setToken(authRes.access_token);
    authStore.setUser(authRes.user);
    currentUser = authRes.user;
    location.hash = 'dashboard';
    route();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = reg ? 'Register' : 'Log in';
  }
  return false;
}

function logout() {
  api('/auth/logout', { method: 'POST' }).catch(()=>{});
  authStore.removeToken();
  authStore.removeUser();
  currentUser = null;
  route();
}

async function route() {
  const token = authStore.getToken();
  if (!token) return authView();
  
  if (!currentUser) {
    try {
      currentUser = await api('/auth/me');
      authStore.setUser(currentUser);
    } catch (e) {
      return authView();
    }
  }

  await fetchMachines();

  const u = currentUser;
  const p = (location.hash.slice(1) || 'dashboard');
  const pg = PG[p] && (p !== 'admin' || u.role === 'admin') ? p : 'dashboard';
  
  Chart.defaults.color = getComputedStyle(document.body).getPropertyValue('--mut').trim() || '#5c7487';
  Chart.defaults.font.family = "'Plus Jakarta Sans',sans-serif";
  
  $('#app').innerHTML = `<header><span class=logo>⚡ ClearWait</span><nav>${NAV.filter(n=>n[0]!=='admin'||u.role==='admin').map(n=>`<a href="#${n[0]}" class="${n[0]===pg?'on':''}">${n[1]}</a>`).join('')}</nav><span class=who>${u.name} · ${u.role}<button class="sm sec" onclick=logout()>Log out</button></span></header><main id=page><div class=loader>Loading data...</div></main>`;
  
  if (PG[pg]) PG[pg]();
}

addEventListener('hashchange', () => me() && route());

/* ---------- pages ---------- */
const PG = {};

PG.dashboard = async () => {
  $('#page').innerHTML = `<div class=loader>Loading live dashboard...</div>`;
  try {
    const stats = await api('/dashboard/stats');
    const bookings = await api('/bookings');
    const now = new Date(), td = iso(now), hr = now.getHours();
    const u = me();

    $('#page').innerHTML = `<h1>Hello, ${u.name.split(' ')[0]} 👋</h1><p class=sub>Live laundry overview for ${DAYS[now.getDay()]}, ${td}</p>
<div class="grid g4">
  <div class="card stat"><b>${stats.total_machines}</b><span>Total machines</span></div>
  <div class="card stat"><b>${stats.occupied_now}</b><span>Occupied now</span></div>
  <div class="card stat"><b>${stats.available_now}</b><span>Available now</span></div>
  <div class="card stat"><b>${stats.confirmed_bookings}</b><span>Confirmed bookings</span></div>
  <div class="card stat"><b>${stats.total_wash_cycles}</b><span>Total wash cycles</span></div>
  <div class="card stat"><b>${stats.average_utilisation.toFixed(0)}%</b><span>Avg utilisation</span></div>
  <div class="card stat"><b style="font-size:20px;padding-top:6px"><span class=pill style="background:${stats.current_demand_color}">${stats.current_demand_level}</span></b><span>Current demand</span></div>
</div>
<div class="card" style="margin-top:16px">
  <h2>Today’s demand by hour</h2>
  <div class=strip>${stats.today_demand_strip.map(s=>`<div title="${s.label} ${s.name}" style="background:${s.color};${s.is_current?'outline:3px solid var(--blue)':''}">${s.hour}</div>`).join('')}</div>
  <p class=sub style="margin:10px 0 0;font-size:12px">🟩 Low · 🟨 Medium · 🟥 High (from K-Means clusters). Outlined = now.</p>
</div>
<div class="grid g2" style="margin-top:16px">
  <div class=card>
    <h2>Recommended times today</h2>
    ${stats.recommended_today.length ? stats.recommended_today.map(r=>`<div class=rec style="padding:6px 0"><span><b>${r.time}</b> <span class=pill style="background:${r.cluster_color}">${r.cluster_name}</span></span><small>${r.free_machines} machines free</small></div>`).join('') : '<p class=sub>No more slots today – try tomorrow.</p>'}
    <a class=btn href="#best" style="display:inline-block;text-decoration:none;margin-top:8px">Find best time</a>
  </div>
  <div class=card>
    <h2>${u.role==='admin'?'Recent bookings':'Your bookings'}</h2>
    ${bTable(bookings.slice(0, 5), u.role==='admin')}
  </div>
</div>`;
  } catch(e) {
    $('#page').innerHTML = `<p class=sub>Error loading dashboard stats.</p>`;
  }
};

PG.analytics = async () => {
  const t = new Date(), f = new Date();
  f.setDate(t.getDate() - 28);
  const machines = await fetchMachines();

  $('#page').innerHTML = `<h1>Usage Analytics</h1><p class=sub>Explore when machines are used. Filter by date, day and machine.</p>
<div class=bar>
  <label>From<input type=date id=f1 value="${iso(f)}"></label>
  <label>To<input type=date id=f2 value="${iso(t)}"></label>
  <label>Day<select id=f3><option value=all>All days${DAYS.map((d,i)=>`<option value=${i}>${d}`).join('')}</select></label>
  <label>Machine<select id=f4><option value=all>All machines${machines.map(m=>`<option value=${m.id}>${m.name}`).join('')}</select></label>
</div>
<div class="grid g2">
  <div class=card><h2>Machine usage by hour (avg cycles/day)</h2><div class=cv><canvas id=c1></canvas></div></div>
  <div class=card><h2>Daily usage comparison</h2><div class=cv><canvas id=c2></canvas></div></div>
  <div class=card><h2>Weekday vs weekend</h2><div class=cv><canvas id=c3></canvas></div></div>
  <div class=card><h2>Machine-wise utilisation (%)</h2><div class=cv><canvas id=c4></canvas></div></div>
  <div class=card><h2>🔥 Peak-hour analysis</h2><div id=pk></div></div>
  <div class=card><h2>🌿 Low-demand time slots</h2><div id=lw></div></div>
  <div class=card><h2>Booking trends</h2><div class=cv><canvas id=c5></canvas></div></div>
  <div class=card><h2>Heatmap · day × hour</h2><div id=hm></div></div>
</div>`;

  ['f1','f2','f3','f4'].forEach(i => $('#'+i).onchange = drawA);
  drawA();
};

async function drawA() {
  const f1 = $('#f1').value, f2 = $('#f2').value, f3 = $('#f3').value, f4 = $('#f4').value;
  let params = new URLSearchParams();
  if (f1) params.append('from_date', f1);
  if (f2) params.append('to_date', f2);
  if (f3) params.append('dow', f3);
  if (f4) params.append('machine_id', f4);

  try {
    const data = await api(`/analytics?${params.toString()}`);
    const H = data.hourly_avg;
    ch('c1', {
      type: 'bar',
      data: {
        labels: HRS.map(fh),
        datasets: [{
          data: H,
          backgroundColor: H.map(v => v > 3.5 ? '#dc2626' : v > 2 ? '#eab308' : '#16a34a'),
          borderRadius: 6
        }]
      },
      options: { plugins: { legend: { display: false } } }
    });

    ch('c2', {
      type: 'line',
      data: {
        labels: data.daily_trend.labels,
        datasets: [{
          data: data.daily_trend.data,
          borderColor: '#1d6fd8',
          backgroundColor: 'rgba(29,111,216,.15)',
          fill: true,
          tension: 0.35
        }]
      },
      options: { plugins: { legend: { display: false } } }
    });

    ch('c3', {
      type: 'doughnut',
      data: {
        labels: data.weekday_vs_weekend.labels,
        datasets: [{
          data: data.weekday_vs_weekend.data,
          backgroundColor: ['#1d6fd8', '#0fb5a8']
        }]
      }
    });

    ch('c4', {
      type: 'bar',
      data: {
        labels: data.machine_utilisation.map(m => m.machine_name),
        datasets: [{
          data: data.machine_utilisation.map(m => m.utilisation_pct),
          backgroundColor: '#0fb5a8',
          borderRadius: 6
        }]
      },
      options: { indexAxis: 'y', plugins: { legend: { display: false } } }
    });

    ch('c5', {
      type: 'line',
      data: {
        labels: data.booking_trends.labels,
        datasets: [{
          label: 'Bookings',
          data: data.booking_trends.data,
          borderColor: '#0fb5a8',
          tension: 0.3
        }]
      },
      options: { plugins: { legend: { display: false } } }
    });

    const ch5 = (L, c) => L.map(x => `<span class=chip style="border-left:4px solid ${c}">${fh(x.hour)} · ${x.avg.toFixed(1)}</span>`).join('');
    $('#pk').innerHTML = ch5(data.peak_hours, '#dc2626') + '<p class=sub>Busiest hours – avoid these for short waits.</p>';
    $('#lw').innerHTML = ch5(data.low_demand_slots, '#16a34a') + '<p class=sub>Quietest hours – best chance of a free machine.</p>';

    const hm = data.heatmap;
    $('#hm').innerHTML = `<div class=wrap><div class=heat><div></div>${hm.hours.map(h=>`<div style="color:var(--mut)">${h}</div>`).join('')}${hm.grid.map((r,d)=>`<div style="color:var(--mut);justify-content:flex-start">${DAYS[d]}</div>`+r.map((g,i)=>`<div title="${DAYS[d]} ${fh(H0+i)}: ${g.avg.toFixed(1)} cycles" style="background:hsl(${135-135*g.avg/hm.max_avg},70%,45%)">${g.avg.toFixed(1)}</div>`).join('')).join('')}</div></div>`;
  } catch (err) {}
}

let KK = 3, KM = 'all';
PG.kmeans = async () => {
  $('#page').innerHTML = `<div class=loader>Running K-Means clustering algorithm...</div>`;
  const machines = await fetchMachines();
  try {
    const r = await api(`/kmeans?k=${KK}&machine_id=${KM}`);
    $('#page').innerHTML = `<h1>K-Means Clustering</h1><p class=sub>Every weekly time slot (day + hour) is grouped by how busy it usually is.</p>
<div class=bar>
  <label>Clusters (k)<select id=kk>${[2,3,4,5].map(k=>`<option ${k===KK?'selected':''}>${k}`).join('')}</select></label>
  <label>Machine<select id=km><option value=all>All machines${machines.map(m=>`<option value=${m.id} ${m.id===KM?'selected':''}>${m.name}`).join('')}</select></label>
</div>
<div class="grid g4">${r.cents.map(c=>`<div class="card stat" style="border-top:5px solid ${c.color}"><span class=pill style="background:${c.color}">${c.name} usage</span><b>${c.avg.toFixed(2)}</b><span>centroid · avg machines busy<br>peak-day centroid: ${c.max.toFixed(2)} · ${c.n} slots</span></div>`).join('')}</div>
<div class=card style="margin-top:16px"><h2>Cluster scatter plot</h2><div class=cv style="height:340px"><canvas id=sc></canvas></div></div>
<div class="card" style="margin-top:16px"><h2>In simple words</h2><p>${r.total_cycles} wash cycles were analysed across ${r.total_days} days. For each of the ${r.slots.length} weekly slots we measured the average and the highest number of machines running, scaled both to the same range (z-score) and ran scikit-learn K-Means (StandardScaler, n_init=10, random_state=42).</p>
<p>Cluster names were assigned by sorting centroids from lowest to highest: the lowest centre is <b>${r.cents[0].name}</b> (about ${r.cents[0].avg.toFixed(1)} machines busy) and the highest is <b>${r.cents.at(-1).name}</b> (about ${r.cents.at(-1).avg.toFixed(1)}). Washing in a green slot means short or no waiting; red slots are best avoided. Results are recalculated automatically on the backend whenever usage data changes.</p></div>
<div class="grid g2" style="margin-top:16px">${r.cents.map(c=>`<div class=card style="border-left:6px solid ${c.color}"><h2>${c.name} usage slots (${c.n})</h2>${DAYS.map((d,i)=>{const hh=r.slots.filter(s=>s.d===i&&s.rank===c.rank).map(s=>s.h);return hh.length?`<div><b>${d}</b> ${hh.map(h=>`<span class=chip>${fh(h)}</span>`).join('')}</div>`:''}).join('')}</div>`).join('')}</div>`;

    $('#kk').onchange = e => { KK = +e.target.value; PG.kmeans(); };
    $('#km').onchange = e => { KM = e.target.value; PG.kmeans(); };

    ch('sc', {
      type: 'scatter',
      data: {
        datasets: r.cents.map(c => ({
          label: c.name + ' usage',
          data: r.slots.filter(s => s.rank === c.rank).map(s => ({ x: s.h + (s.d - 3) * 0.09, y: s.avg, d: s.d })),
          backgroundColor: c.color,
          pointRadius: 5
        }))
      },
      options: {
        scales: {
          x: { title: { display: true, text: 'Hour of day' }, min: 5, max: 23 },
          y: { title: { display: true, text: 'Avg machines busy' } }
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: c => `${DAYS[c.raw.d]} ${fh(Math.round(c.raw.x))} · ${c.raw.y.toFixed(2)} busy`
            }
          }
        }
      }
    });

    const c0 = charts.sc;
    r.cents.forEach(c => {
      c0.data.datasets.push({
        label: c.name + ' centroid',
        type: 'line',
        data: [{ x: 5, y: c.avg }, { x: 23, y: c.avg }],
        borderColor: c.color,
        borderDash: [6, 5],
        pointRadius: 0,
        borderWidth: 1.5
      });
    });
    c0.update();
  } catch (err) {}
};

let BS = { d: iso(new Date(Date.now() + 864e5)), p: 'Evening', m: 'any' };
PG.best = async () => {
  const machines = await fetchMachines();
  const PER_KEYS = ['Morning', 'Afternoon', 'Evening'];
  $('#page').innerHTML = `<h1>Find Best Time to Wash</h1><p class=sub>Recommendations from historical usage clusters and real confirmed bookings.</p>
<div class=bar>
  <label>Date<input type=date id=bd min="${iso(new Date())}" value="${BS.d}"></label>
  <label>Period<select id=bp>${PER_KEYS.map(p=>`<option ${p===BS.p?'selected':''}>${p}`).join('')}</select></label>
  <label>Machine<select id=bm><option value=any>Any available machine${machines.map(m=>`<option value=${m.id} ${m.id===BS.m?'selected':''}>${m.name}`).join('')}</select></label>
  <button onclick=findBest()>Find best time</button>
</div><div id=res><div class=loader>Loading recommendations...</div></div>`;

  ['bd','bp','bm'].forEach(i => $('#'+i).onchange = findBest);
  findBest();
};

async function findBest() {
  BS = { d: $('#bd').value, p: $('#bp').value, m: $('#bm').value };
  if (!BS.d) return;
  try {
    const data = await api(`/recommend?date=${BS.d}&period=${BS.p}&machine=${BS.m}`);
    const r = data.recommendations;
    const avoid = data.peak_hours_to_avoid;
    const dayName = DAYS[new Date(BS.d + 'T00:00').getDay()];

    $('#res').innerHTML = (r.length ? r.map((x, i) => `
<div class=card style="margin-bottom:12px;border-left:6px solid ${x.cluster_color}">
  <div class=rec>
    <div>
      <h2 style="margin:0">${i===0?'⭐ ':''}${x.label} <span class=pill style="background:${x.cluster_color}">${x.cluster_name}</span></h2>
      <p class=sub style="margin:4px 0 0">${x.reason}</p>
    </div>
    <div style="min-width:170px">
      <small>Expected demand ${x.expected_demand_pct.toFixed(0)}% · ${x.free_machines_count} machine${x.free_machines_count===1?'':'s'} free</small>
      <div class=meter><i style="width:${x.expected_demand_pct}%;background:${x.cluster_color}"></i></div>
      ${x.free_machines_count ? `<button onclick="bookSlot('${BS.d}',${x.hour},'${BS.m}')">Book slot</button>` : '<button class=sec disabled>Fully booked</button>'}
    </div>
  </div>
</div>`).join('') : '<div class=card>No open slots for this selection.</div>') +
    `<div class=card><h2>🚫 Peak hours to avoid on ${dayName}s</h2>${avoid.map(h=>`<span class=chip style="border-left:4px solid var(--r)">${fh(h)}</span>`).join('')||'None'}</div>`;
  } catch (e) {}
}

PG.bookings = async () => {
  $('#page').innerHTML = `<div class=loader>Loading your bookings...</div>`;
  try {
    const bookings = await api('/bookings');
    $('#page').innerHTML = `<h1>My Bookings</h1><p class=sub>History, upcoming slots and cancellations.</p><div class=card>${bTable(bookings.filter(b=>b.user_email===me().email), false)}</div>`;
  } catch (e) {}
};

PG.admin = async () => {
  $('#page').innerHTML = `<div class=loader>Loading admin panel...</div>`;
  try {
    const [machines, blocked, bookings] = await Promise.all([
      fetchMachines(),
      api('/slots/blocked'),
      api('/bookings')
    ]);

    $('#page').innerHTML = `<h1>Administration</h1><p class=sub>Manage machines, time slots, usage records and bookings.</p>
<div class="grid g2">
  <div class=card>
    <h2>Machines</h2>
    <div class=wrap>
      <table>${machines.map(m=>`<tr><td>${m.name}<td><select onchange="setSt('${m.id}',this.value)">${['available','occupied','maintenance'].map(s=>`<option ${s===m.status?'selected':''}>${s}`).join('')}</select><td><button class="sm del" onclick="rmM('${m.id}')">Remove</button>`).join('')}</table>
    </div>
    <button class=sm style="margin-top:10px" onclick=addM()>+ Add machine</button>
  </div>
  <div class=card>
    <h2>Bookable time slots</h2>
    <p class=sub>Tap an hour to block or open it.</p>
    ${HRS.map(h=>`<button class="sm ${blocked.includes(h)?'del':'sec'}" style="margin:2px" onclick="tgl(${h})">${fh(h)}</button>`).join('')}
  </div>
  <div class=card>
    <h2>Add usage record</h2>
    <div class=bar>
      <label>Date<input type=date id=ud value="${iso(new Date())}"></label>
      <label>Hour<select id=uh>${HRS.map(h=>`<option value=${h}>${fh(h)}`).join('')}</select></label>
      <label>Machine<select id=um>${machines.map(m=>`<option value=${m.id}>${m.name}`).join('')}</select></label>
      <button onclick=addR()>Add</button>
    </div>
    <label>Upload CSV (date,hour,machine)<input type=file id=uf accept=".csv" onchange=upl(this)></label>
    <p class=sub>Usage records drive K-Means clusters automatically.</p>
  </div>
  <div class=card style="grid-column:1/-1">
    <h2>All bookings</h2>
    ${bTable(bookings, true)}
  </div>
</div>`;
  } catch (e) {}
};

async function setSt(id, s) {
  try {
    await api(`/machines/${id}/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status: s })
    });
    toast('Status updated');
    await fetchMachines();
  } catch(e) {}
}

async function rmM(id) {
  if (!confirm(`Delete machine ${id}?`)) return;
  try {
    await api(`/machines/${id}`, { method: 'DELETE' });
    toast('Machine removed');
    PG.admin();
  } catch(e) {}
}

async function addM() {
  const name = prompt('Machine name (e.g. Machine 7):');
  if (!name) return;
  try {
    await api('/machines', {
      method: 'POST',
      body: JSON.stringify({ name })
    });
    toast('Machine added');
    PG.admin();
  } catch(e) {}
}

async function tgl(h) {
  try {
    await api('/slots/toggle', {
      method: 'POST',
      body: JSON.stringify({ hour: h })
    });
    toast(`Hour ${fh(h)} updated`);
    PG.admin();
  } catch(e) {}
}

async function addR() {
  const d = $('#ud').value, h = +$('#uh').value, m = $('#um').value;
  try {
    await api('/records', {
      method: 'POST',
      body: JSON.stringify({ date: d, hour: h, machine_id: m })
    });
    toast('Record added – clusters updated');
    PG.admin();
  } catch(e) {}
}

async function upl(input) {
  const f = input.files[0];
  if (!f) return;
  const formData = new FormData();
  formData.append('file', f);
  try {
    const res = await api('/records/upload-csv', {
      method: 'POST',
      body: formData
    });
    toast(res.message || 'Records imported – clusters updated');
    PG.admin();
  } catch(e) {}
}

route();
</script></body></html>
