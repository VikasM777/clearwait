services:
  - type: web
    name: quiethours-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiethours-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://vikasm777.github.io,http://localhost:3000,http://127.0.0.1:5500"

databases:
  - name: quiethours-db
    plan: free
